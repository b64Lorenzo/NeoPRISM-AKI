<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">NeoPRISM-AKI perioperative research framework</title>
  <desc id="desc">A prism disperses a perioperative data signal into multiple model paths. The planned model scope includes a multi-output perceptron and additional model families. Research software only.</desc>
  <rect width="1600" height="560" fill="#0b1728"/>
  <path d="M492 72 V490" stroke="#334155" stroke-width="2"/>
  <svg x="52" y="72" width="420" height="420" viewBox="0 0 512 512">
    <rect width="512" height="512" rx="44" fill="#0b1728"/>
    <path d="M30 256 H68 L82 236 L96 275 L112 204 L128 256 H169" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M256 65 L116 372 H396 Z" fill="#16364f" stroke="#7dd3fc" stroke-width="7" stroke-linejoin="round"/>
    <path d="M166 256 H256" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
    <path d="M256 256 L305 226 L478 126" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 256 L305 242 L478 184" fill="none" stroke="#2dd4bf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 256 H478" fill="none" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
    <path d="M256 256 L305 270 L478 328" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M256 256 L305 286 L478 386" fill="none" stroke="#fb7185" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="256" r="9" fill="#f8fafc"/>
  </svg>
  <text x="540" y="144" fill="#94a3b8" font-family="Segoe UI, Aptos, sans-serif" font-size="18" font-weight="600" letter-spacing="3">PERIOPERATIVE AKI RESEARCH</text>
  <text x="536" y="230" fill="#f8fafc" font-family="Segoe UI, Aptos, sans-serif" font-size="72" font-weight="700">NeoPRISM<tspan fill="#7dd3fc">-AKI</tspan></text>
  <text x="540" y="291" fill="#e2e8f0" font-family="Segoe UI, Aptos, sans-serif" font-size="29" font-weight="400">Configurable preprocessing · missingness views</text>
  <text x="540" y="331" fill="#94a3b8" font-family="Segoe UI, Aptos, sans-serif" font-size="22" font-weight="400">Patient-level inputs · flexible model research</text>
  <path d="M540 367 H1520" stroke="#334155" stroke-width="2"/>
  <text x="540" y="410" fill="#2dd4bf" font-family="Segoe UI, Aptos, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MODEL ROADMAP</text>
  <text x="540" y="446" fill="#f1f5f9" font-family="Segoe UI, Aptos, sans-serif" font-size="22" font-weight="500">Multi-output perceptron · additional model families</text>
  <text x="540" y="489" fill="#94a3b8" font-family="Segoe UI, Aptos, sans-serif" font-size="16" font-weight="600" letter-spacing="1.2">PREOPERATIVE  /  INTRAOPERATIVE  /  POSTOPERATIVE</text>
  <text x="540" y="526" fill="#94a3b8" font-family="Segoe UI, Aptos, sans-serif" font-size="15" font-weight="600" letter-spacing="1.2">RESEARCH SOFTWARE · NOT FOR CLINICAL DECISION-MAKING</text>
</svg>
