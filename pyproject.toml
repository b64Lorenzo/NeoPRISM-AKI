[project]
name = "aki-pipeline"
version = "0.4.0"
description = "Research-only perioperative AKI preprocessing and model-baseline framework"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
    "pandas",
    "plotly",
    "ray>=2.60.1,<2.61",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
