# Classifier settings only: no patient CSV paths, output paths, features, target,
# split fraction or seed belong here. Those stay in the CLI or pipeline XML.
# Reading this file starts nothing and creates no directories.
# Every training profile uses a real, local Ray worker: no in-process fallback,
# remote cluster address, GPU setting or selectable backend is supported.
# Each fit is one worker task, not distributed/data-parallel SGD. CPU resources
# are logical scheduling reservations, not hard physical thread limits.
# The driver fits preprocessing on training patients only; workers receive numeric
# arrays/settings, not patient identifiers, clinical source paths or raw records.
# Numeric arrays and Ray's temporary/object-store files still need protection.
# Ray support on Windows is beta; see the installation/platform notes in the docs.
#
# Use --config with mlp-train, multioutput-train or logistic-train. With an INI,
# architecture/training CLI flags are rejected even when their values agree.
# Without --config the existing CLI settings remain available and still use Ray.
# --profile selects
# a named section; otherwise the section name is the command's model_type.
# Prediction uses the saved artifact, not this INI, and does not need Ray.
# XML uses config/profile model options; config is relative to the XML file.
# Disabled XML model entries do not open referenced INIs.
#
# Keys and names are case-sensitive. No [DEFAULT], inherited values, interpolation
# or environment/tilde expansion. Comments must occupy their own lines; inline
# comments are not stripped from values. Every declared profile is validated.

[ray]
# Optional section; omitted keys use these same defaults. Counts must be positive.
num_cpus = 1
# A positive fractional CPU reservation is allowed, but must not exceed num_cpus.
cpus_per_task = 1
# Positive finite maximum task wait, in seconds; not an epoch count.
timeout_seconds = 300
# Empty selects neoprism-ray beneath Python's temporary directory. A relative path is
# relative to THIS INI's directory, never the XML's directory or the working dir.
# On Windows choose a short directory, e.g. C:/raytmp: Ray puts a dashboard port
# filename of roughly 80 characters inside a session directory. Deeply nested
# test/output directories can exceed MAX_PATH even if the root itself fits.
# The parser resolves this path but does not create it.
temp_directory =

[multilayer_perceptron]
# Required in every model section, including sections named after a model type.
model_type = multilayer_perceptron
# Hidden widths in forward order; input width is inferred AFTER preprocessing,
# output width K from the observed training classes. Empty means no hidden layer.
hidden_layers = 16,8
# One name per HIDDEN layer, not input/output: relu, leaky_relu, sigmoid, tanh,
# linear. Omit to use relu in every hidden layer. An explicit list is never
# broadcast: two widths require two names. With no hidden layers, empty is valid.
hidden_activations = relu,tanh
# Optional. One initializer per HIDDEN + OUTPUT layer, so two hidden layers need
# three names. Choices: he, xavier, zero. Omit this key for automatic He on relu /
# leaky_relu and Xavier otherwise, including the softmax output. Zero hidden
# weights can preserve unwanted symmetry; they are permitted, not recommended.
init_methods = he,xavier,xavier
# Classification INIs require this pair, even for K=2. These keys are explicit
# for review/editing, but sigmoid/BCE and regression/MSE pairs are not accepted.
# Numerical Python APIs may separately support those other tasks.
output_activation = softmax
loss = cross_entropy
# Positive integer maximum epochs and minibatch size; positive finite rate.
epochs = 1000
learning_rate = 0.05
batch_size = 32
# Nonnegative training-loss improvement threshold; zero disables early stopping.
# Training history is not validation performance.
tolerance = 0

[multi_output_perceptron]
# A genuine hard multiclass perceptron: linear class scores, hard argmax decisions
# and online mistake-driven updates. It is NOT zero-hidden softmax/logistic
# regression and does not produce probabilities at all.
model_type = multi_output_perceptron
output_activation = linear
loss = mistake_rate
epochs = 1000
learning_rate = 0.05
# No hidden_layers, hidden_activations, init_methods, batch_size, tolerance or l2.

[logistic_regression]
# Full K-class softmax, including K=2, with mean negative log likelihood plus
# (l2 / 2) * sum(W**2). Bias/intercept is not regularized. This is the linear
# probabilistic comparator, not the hard multiclass perceptron above.
model_type = logistic_regression
output_activation = softmax
loss = cross_entropy
epochs = 1000
learning_rate = 0.05
batch_size = 32
tolerance = 0
# Nonnegative finite weight penalty.
l2 = 0

# Additional profiles can use another section name and the required model_type.
# All profiles are checked, including ones not selected for this run. For example:
# [compact_mlp]
# model_type = multilayer_perceptron
# hidden_layers = 4
# hidden_activations = tanh
# init_methods = xavier,xavier
# Select with: mlp-train --config config/models.example.ini --profile compact_mlp
# (Uncomment that section before selecting it.)
