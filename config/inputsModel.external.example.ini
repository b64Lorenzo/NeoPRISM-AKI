[paths]
input_directory = results/parameters
parameter_config = config/parameters.ini
; Only needed when labels.source is external, external_override, or consensus
labels_csv = data/labels/aki_labels.csv
output_directory = results/inputsModel

[features]
; Explicit phase/parameter_id; no implicit postoperative predictors.
parameter_ids = preoperative/age, preoperative/sex, preoperative/bmi, preoperative/kreatinine
aggregation = patient_mean
; For sequential intraoperative snapshots set a finite cutoff (minutes since start).
; Leave blank for preoperative or end-of-operation modelling.
cutoff_minutes =

[labels]
; external: clinician-adjudicated CSV (requires labels_csv)
; creatinine: derived from extracted creatinine (no CSV required)
; external_override: prefer adjudicated labels, fallback to creatinine
; consensus: label only when adjudicated and creatinine binary outcomes agree
source = external
; Binary -1/+1, or clinically adjudicated KDIGO stages 0,1,2,3 -> -1/+1.
kind = binary
column = aki_label

[clinical_aki]
; Research-only creatinine staging from Zappitelli et al. 2017 neonatal
; modification (stage 3 >=2.5 mg/dL), or conventional kdigo_2012 (>=4).
creatinine_parameter_id = kreatinine
creatinine_unit = umol/L
baseline_strategy = preoperative_last
window_hours = 72
threshold_profile = neonatal_2017
include_intraoperative_baseline = false
