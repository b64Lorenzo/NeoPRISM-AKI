; TEMPLATE ONLY: replace source_fields, timestamp and boundary mappings with
; the actual columns in your Epic CSV files before extraction.
[settings]
missing_tokens = NA,N/A,null,None,nan
strict_columns = false

[timestamps]
fields = epic.timestamp

[boundary.operation_start]
fields = epic.event
phrases = operation start

[boundary.operation_end]
fields = epic.event
phrases = operation end

[parameter.age]
phase = preoperative
source_fields = epic.age
type = numeric
unit = months
timed = false

[parameter.sex]
phase = preoperative
source_fields = epic.sex
type = str
unit =
timed = false

[parameter.weight]
phase = preoperative
source_fields = epic.weight
type = numeric
unit = kg
timed = false

[parameter.height]
phase = preoperative
source_fields = epic.height
type = numeric
unit = cm
timed = false

[parameter.bmi]
phase = preoperative
source_fields =
type = numeric
unit = kg/m2
timed = false
derive = bmi
weight_parameter_id = weight
height_parameter_id = height

[parameter.kreatinine]
phase = preoperative, postoperative
source_fields = epic.creatinine
type = numeric
unit = umol/L
timed = true

[parameter.operation_duration]
phase = intraoperative
source_fields =
type = numeric
unit = minutes
timed = false
derive = operation_duration
