[paths]
input_directory = results/parameters
parameter_config = config/parameters.ini
output_directory = results/plots

[general]
theme = dark
format = html
max_patients = 500
max_categories = 30

[selection]
phases = preoperative, intraoperative, postoperative
parameter_ids =
class_names =
families =
patient_ids =
mode = union

[families]
demographics = age, sex, bmi, height, weight
renal = kreatinine

[distributions]
enabled = true
bins = 30
numeric_aggregation = patient_mean

[frequencies]
enabled = true
normalize = true

[missingness]
enabled = true
parameter_ids = age, sex, bmi
phases = preoperative

[parameter_availability]
enabled = true
parameter_ids = kreatinine, bmi
phases = preoperative, postoperative

[value_heatmaps]
enabled = true
aggregation = patient_mean
parameter_ids = age, bmi, height, weight, kreatinine
phases = all

[time_series]
enabled = true
group_by = parameter
max_patients = 20

[patient_timelines]
enabled = true
max_patients = 20

[patient_dashboards]
enabled = true
output_directory = results/plots/patients
include_plotlyjs = true
