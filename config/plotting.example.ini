
[paths]
input_directory = results/parameters
parameter_config = config/parameters.ini
output_directory = results/plots


[general]
theme = dark
format = html
max_patients = 500
max_categories = 30


; ============================================================
; GENERAL PARAMETER SELECTION
; ============================================================
; Used by distributions, frequencies, time series and
; patient timelines.
;
; Empty filters mean no restriction.
; Heatmaps and parameter availability have independent
; parameter and phase selections.

[selection]
phases = preoperative, intraoperative, postoperative
parameter_ids =
class_names =
families =
patient_ids =
mode = union


; ============================================================
; PARAMETER FAMILIES
; ============================================================

[families]
demographics = age, sex, bmi, height, weight
renal = kreatinine


; ============================================================
; DISTRIBUTIONS
; ============================================================

[distributions]
enabled = true
bins = 30
numeric_aggregation = patient_mean


; ============================================================
; CATEGORICAL FREQUENCIES
; ============================================================

[frequencies]
enabled = true
normalize = true


; ============================================================
; MISSING-DATA HEATMAP
; ============================================================
; Select parameters and phases independently.
;
; parameter_ids = all  -> all eligible parameters
; phases = all         -> all three clinical phases
;
; If phases is omitted, all phases are selected.
; Both numeric and categorical parameters are supported.

[missingness]
enabled = true
parameter_ids = age, bmi, height, weight, kreatinine
phases = preoperative


; ============================================================
; PARAMETER AVAILABILITY
; ============================================================
; Independent of [selection] and [missingness].
;
; Shows availability for each selected parameter and phase.

[parameter_availability]
enabled = true
parameter_ids = age, bmi, height, weight, kreatinine
phases = preoperative, postoperative


; ============================================================
; NUMERICAL VALUE HEATMAPS
; ============================================================
; Only numeric and timeseries parameters are eligible.
;
; aggregation:
;   patient_mean
;
; Each parameter-phase combination is treated separately.

[value_heatmaps]
enabled = true
aggregation = patient_mean
parameter_ids = age, bmi, height, weight, kreatinine
phases = all


; ============================================================
; TIME SERIES
; ============================================================

[time_series]
enabled = true
group_by = parameter
max_patients = 20


; ============================================================
; PATIENT TIMELINES
; ============================================================

[patient_timelines]
enabled = true
max_patients = 20


; ============================================================
; INDIVIDUAL PATIENT HTML DASHBOARDS
; ============================================================
; One standalone HTML dashboard per patient.
;
; Includes:
;   - Preoperative, intraoperative and postoperative data
;   - Operation start and end markers
;   - Epic events
;   - Numeric measurements over time
;   - Parameter summaries

[patient_dashboards]
enabled = true
output_directory = results/plots/patients
include_plotlyjs = true
